<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10243a"><title>Vaasan kadut pyörällä</title><link rel="manifest" href="manifest.webmanifest"><style>body{margin:0;background:#10243a;color:white;font:16px system-ui}header{padding:16px}h1{font-size:22px;margin:0 0 8px}.small{font-size:13px;color:#bed1e3}button{border:0;border-radius:10px;padding:13px;margin:5px;background:#31d09a;color:#08241c;font-weight:700}button.secondary{background:#d8e4f0}#map{height:60vh;background:#dbe6e9;position:relative}#map iframe{width:100%;height:100%;border:0}#badge{position:absolute;top:8px;left:8px;background:#10243ae8;color:white;padding:8px;border-radius:8px;font-size:12px}#status{padding:14px}a{color:#9de9ff}</style></head><body><header><h1>🚲 Vaasan kadut pyörällä</h1><div class="small">GPS-seurannan testiversio · tallentaa reittipisteet laitteelle</div><button id="start">Aloita pyöräily</button><button id="stop" class="secondary">Pysäytä</button><button id="export" class="secondary">Vie GPX</button></header><div id="map"><iframe title="Vaasan kartta" src="https://www.openstreetmap.org/export/embed.html?bbox=21.55%2C62.98%2C21.67%2C63.13&layer=mapnik" loading="lazy"></iframe><div id="badge">Kartta vaatii internetin. GPS-reitti tallentuu myös offline.</div></div><div id="status">GPS ei ole vielä käynnissä.</div><script>let pts=JSON.parse(localStorage.getItem('vaasaRidePoints')||'[]'),watch=null;const s=document.getElementById('status');function refresh(msg){s.textContent=(msg||'')+' Tallennettuja GPS-pisteitä: '+pts.length+'.';}document.getElementById('start').onclick=()=>{if(!navigator.geolocation){refresh('GPS ei ole käytettävissä.');return}if(watch!==null)return;watch=navigator.geolocation.watchPosition(p=>{let x={lat:p.coords.latitude,lon:p.coords.longitude,time:new Date().toISOString(),accuracy:p.coords.accuracy,speed:p.coords.speed};if(x.accuracy<=80){pts.push(x);localStorage.setItem('vaasaRidePoints',JSON.stringify(pts));}refresh('Seuranta käynnissä. Tarkkuus '+Math.round(x.accuracy)+' m.')},e=>refresh('GPS-virhe: '+e.message),{enableHighAccuracy:true,maximumAge:0,timeout:20000});refresh('GPS käynnistyy…')};document.getElementById('stop').onclick=()=>{if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;refresh('Seuranta pysäytetty.')};document.getElementById('export').onclick=()=>{if(!pts.length){refresh('Ei vielä reittipisteitä.');return}let xml='<?xml version="1.0"?><gpx version="1.1" creator="Vaasan kadut" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>Vaasan pyöräily</name><trkseg>'+pts.map(p=>`<trkpt lat="${p.lat}" lon="${p.lon}"><time>${p.time}</time></trkpt>`).join('')+'</trkseg></trk></gpx>';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([xml],{type:'application/gpx+xml'}));a.download='vaasan-pyoraily.gpx';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};refresh('Valmis.');</script></body></html>
