<div id="authPanel">
  <h2>Vaasan kadut – Kirjautuminen</h2>
  <input id="email" type="email" placeholder="Sähköposti">
  <input id="password" type="password" placeholder="Salasana">
  <button id="registerBtn">Rekisteröidy</button>
  <button id="signInBtn">Kirjaudu sisään</button>
  <button id="signOutBtn" hidden>Kirjaudu ulos</button>
  <p id="authStatus"></p>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAr4JqnVE7APrts4-MdBNjfnhlumqmqaao",
  authDomain: "vaasan-kadut.firebaseapp.com",
  projectId: "vaasan-kadut",
  storageBucket: "vaasan-kadut.firebasestorage.app",
  messagingSenderId: "208957467093",
  appId: "1:208957467093:web:45d7a63c5b355db7c8f55c",
  measurementId: "G-0NY9K19543"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const email = document.getElementById("email");
const password = document.getElementById("password");
const registerBtn = document.getElementById("registerBtn");

const signInBtn = document.getElementById("signInBtn");
const signOutBtn = document.getElementById("signOutBtn");
const authStatus = document.getElementById("authStatus");

registerBtn.onclick = async () => {
  try {
    await createUserWithEmailAndPassword(auth, email.value, password.value);
    password.value = "";
  } catch (error) {
    authStatus.textContent = "Rekisteröinti epäonnistui: " + error.message;
  }
};

signInBtn.onclick = async () => {
  try {
    await signInWithEmailAndPassword(auth, email.value, password.value);
    password.value = "";
  } catch (error) {
    authStatus.textContent = "Kirjautuminen epäonnistui: " + error.message;
  }
};

signOutBtn.onclick = async () => {
  try {
    await signOut(auth);
  } catch (error) {
    authStatus.textContent = "Uloskirjautuminen epäonnistui: " + error.message;
  }
};

onAuthStateChanged(auth, user => {
  authStatus.textContent = user ? "Kirjautunut: " + user.email : "Et ole kirjautunut.";
  signOutBtn.hidden = !user;
  signInBtn.hidden = !!user;
  registerBtn.hidden = !!user;
});

</script>
